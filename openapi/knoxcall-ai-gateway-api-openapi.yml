      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The connection UUID.
    delete:
      operationId: revokeAiGatewayMcpGrant
      summary: Revoke one person's delegated-OAuth connection
      description: 'The stored refresh and access tokens are destroyed. Revoking here does

        not revoke KnoxCall''s authorization at the upstream — do that in the

        upstream''s own account settings if you need it gone there too.'
      tags:
