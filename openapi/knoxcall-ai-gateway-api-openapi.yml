          format: uuid
        name:
          type:
          - string
          - 'null'
        kind:
          type: string
          enum:
          - agent
          - read
          - tool
          - oneshot
        prefix:
          type: string
          description: The non-secret token prefix, safe to display.
        dpop_required:
          type: boolean
        scope_jsonb:
          type: object
          additionalProperties: true
          description: The capability scope (providers/models) the token is bound to.
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
