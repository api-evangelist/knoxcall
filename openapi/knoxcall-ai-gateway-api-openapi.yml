openapi: 3.2.0
info:
  title: KnoxCall Client Management AI Gateway API
  version: '1.0'
  description: 'The KnoxCall Client Management API provides programmatic access to manage your API gateway

    resources including routes, secrets, clients, environments, webhooks, and API keys. ## Authentication


    All requests must include an OAuth 2.1 access token **or** a legacy API key. The

    recommended path for new integrations is the first-party SDKs, which mint, cache, and

    refresh OAuth tokens for you (start with `knoxcall login` on a developer machine, or

    `KNOXCALL_CLIENT_ID` / `KNOXCALL_CLIENT_SECRET` in CI). You can authenticate using any of:


    - **Authorization header (OAuth 2.1 bearer token — recommended)**: `Authorization: Bearer `

    - **Authorization header (legacy API key)**: `Authorization: Bearer tk_xxx_yyy`

    - **x-api-key header (legacy API key)**: `x-api-key: tk_xxx_yyy`


    OAuth 2.1 access tokens (`kc_` prefix) are minted at the root-host token endpoint

    `https://api.knoxcall.com/oauth/token` (not under `/v1`) using the `client_credentials`

    or `authorization_code` grant. See the `OAuth2` security scheme and the `/oauth/*`

    endpoints. Some resources that are managed exclusively through OAuth reject API-key auth

    with a `403 use_oauth` error. Long-lived API keys remain fully supported. They come in three types:

    - **Standard keys** (`tk_` prefix) are used on the production API (`api.knoxcall.com`). - **Test keys** (`tk_` prefix, type=test) are used on the sandbox API (`sandbox.knoxcall.com`). - **Enterprise Access Keys** (`AKE` prefix) follow the format `AKE[16chars]:[40chars]`. Using a test key on the production API (or vice versa) will return a `403 wrong_key_type` error. ## Request IDs


    Every response — success or error — includes an `X-Request-Id` response header (a UUID). Its value is identical to the `request_id` field in the response body (`meta.request_id`

    on success, `error.request_id` on error). Quote it when contacting support. ## API Versioning


    The API is versioned on two axes:


    - **Major version — the `/v1` path prefix.** Breaking changes ship under a new major

    (`/v2`). `/v1` never receives a breaking change. - **Minor version — the `KnoxCall-Version` header (dated, `YYYY-MM-DD`).** Send

    `KnoxCall-Version: 2026-08-05` to pin the behaviour of a specific dated release. Omit

    the header to get the newest minor version. Every response echoes the resolved version

    back in a `KnoxCall-Version` response header. Within a major version, **additive changes are not breaking** and may appear without a new

    dated version: new endpoints, new optional request fields, new response fields, new

    `error.type` values, and new enum members. Clients must tolerate unknown response fields

    and unknown `error.type` values (see the `ErrorResponse` schema). An **unknown or malformed** `KnoxCall-Version` value returns `400` with

    `error.type: invalid_api_version`. ## Rate Limiting


    API keys can have optional rate limits configured. When a limit is configured, the

    following headers are emitted on **every** response (not only `429`s):

    - `X-RateLimit-Limit` -- maximum requests allowed per window

    - `X-RateLimit-Remaining` -- remaining requests in the current window

    - `X-RateLimit-Reset` -- epoch seconds at which the window resets


    When the limit is exceeded the API returns `429` (`rate_limit_exceeded` / `rate_limited`)

    and additionally sets `Retry-After` (seconds until the window resets). ## DPoP sender-constrained tokens, and the server nonce


    A token minted with a `cnf.jkt` binding (DPoP, RFC 9449) requires a `DPoP` proof header

    on every request, signed over the request''s method and canonical public URL. **Every response to a request that carried a `DPoP` header also carries a

    `DPoP-Nonce` response header** -- mints, refusals and successful calls alike, on

    `POST /oauth/token`, `/v1`, the tenant data plane, the self-hosted proxy and the AI

    gateway. The value is stateless and changes every minute; the server accepts the current

    and the previous minute''s, so a nonce is good for 60-120 seconds.'
  contact:
    name: KnoxCall Support
    url: https://knoxcall.com
    email: support@knoxcall.com
  license:
    name: Proprietary
    url: https://knoxcall.com/terms
servers:
- url: https://api.knoxcall.com/v1
  description: Production
- url: https://sandbox.knoxcall.com/v1
  description: Sandbox (test keys only)
security:
- OAuth2: []
- BearerAuth: []
- ApiKeyAuth: []
tags:
- name: AI Gateway
  description: Manage AI egress gateways, their agents, and capability (phantom) tokens, plus cost/token spend rollups and FinOps exports.
paths:
  /ai-gateway/gateways:
    get:
      operationId: listGateways
      summary: List AI gateways
      description: Returns a paginated list of AI gateways for the authenticated tenant and mode. Requires the `ai_gateway` list scope.
      tags:
      - AI Gateway
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: A paginated list of AI gateways.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiGateway'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createGateway
      summary: Create an AI gateway
      description: 'Creates an AI gateway — the top-level container that agents live under.

        `name` and `slug` are required; the slug must be unique within your tenant.'
      tags:
      - AI Gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAiGatewayRequest'
            example:
              name: Production AI
              slug: production-ai
              budget_monthly_usd: 500
      responses:
        '200':
          description: The created gateway.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AiGateway'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai-gateway/gateways/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The AI gateway UUID.
    get:
      operationId: getGateway
      summary: Get an AI gateway
      description: Returns a single AI gateway by id.
      tags:
      - AI Gateway
      responses:
        '200':
          description: The gateway.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AiGateway'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateGateway
      summary: Update an AI gateway
      description: Updates one or more fields on a gateway. Only provided fields are changed.
      tags:
      - AI Gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAiGatewayRequest'
            example:
              budget_monthly_usd: 1000
              geo_velocity_action: block
      responses:
        '200':
          description: The updated gateway.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AiGateway'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteGateway
      summary: Archive an AI gateway
      description: Archives (soft-deletes) a gateway. Returns the gateway id and its new status.
      tags:
      - AI Gateway
      responses:
        '200':
          description: The archived gateway.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        example: archived
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai-gateway/gateways/{gatewayId}/agents:
    parameters:
    - name: gatewayId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The parent AI gateway UUID.
    get:
      operationId: listGatewayAgents
      summary: List a gateway's agents
      description: Returns a paginated list of the agents created under a gateway.
      tags:
      - AI Gateway
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: A paginated list of agents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiGatewayAgent'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createGatewayAgent
      summary: Create an agent
      description: 'Creates an agent under a gateway. `name` and `slug` are required. The

        response includes `agent_url` — the data-plane base URL to point an AI

        SDK at. Subject to the plan''s AI-agent limit.'
      tags:
      - AI Gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAiGatewayAgentRequest'
            example:
              name: Support Bot
              slug: support-bot
              default_model: claude-sonnet-5
      responses:
        '200':
          description: The created agent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AiGatewayAgent'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PlanLimit'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai-gateway/agents/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The AI agent UUID.
    get:
      operationId: getAgent
      summary: Get an agent
      description: Returns a single agent by id (flat path, not nested under its gateway). Includes `agent_url`.
      tags:
      - AI Gateway
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AiGatewayAgent'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateAgent
      summary: Update an agent
      description: Updates one or more fields on an agent. Only provided fields are changed.
      tags:
      - AI Gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAiGatewayAgentRequest'
            example:
              default_model: claude-opus-4-8
              streaming_enabled: true
      responses:
        '200':
          description: The updated agent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AiGatewayAgent'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PlanLimit'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteAgent
      summary: Archive an agent
      description: Archives (soft-deletes) an agent. Returns the agent id and its new status.
      tags:
      - AI Gateway
      responses:
        '200':
          description: The archived agent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        example: archived
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai-gateway/agents/{agentId}/tokens:
    parameters:
    - name: agentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The AI agent UUID.
    get:
      operationId: listPhantomTokens
      summary: List an agent's capability tokens
      description: 'Returns a paginated list of the agent''s capability (phantom) tokens.

        The plaintext token is **never** returned here — only the non-secret

        prefix. The plaintext is shown once, at mint time.'
      tags:
      - AI Gateway
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: A paginated list of capability tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiGatewayPhantomToken'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: mintPhantomToken
      summary: Mint a capability token
      description: 'Mints a capability (phantom) token for the agent. The response `token`

        is the plaintext and is shown **exactly once** — persist it now.

        The token''s environment (live vs test) is derived server-side from the

        authenticating key''s mode. Set `dpop_required` together with `dpop_jkt`

        to bind the token to a DPoP key.'
      tags:
      - AI Gateway
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MintAiGatewayTokenRequest'
            example:
              name: ci-runner
              kind: agent
              expires_in_seconds: 86400
      responses:
        '200':
          description: The minted token. `data.token` is the plaintext, shown once; `meta.note` restates the warning.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AiGatewayPhantomTokenCreated'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        format: uuid
                      note:
                        type: string
                        example: Save this token now — it will not be shown again.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai-gateway/agents/{agentId}/tokens/{tokenId}:
    parameters:
    - name: agentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The AI agent UUID.
    - name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The capability token UUID.
    delete:
      operationId: revokePhantomToken
      summary: Revoke a capability token
      description: Revokes an agent's capability token. Already-revoked or unknown tokens return 404.
      tags:
      - AI Gateway
      responses:
        '200':
          description: The revoked token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      revoked:
                        type: boolean
                        example: true
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai-gateway/gateways/{gatewayId}/tokens:
    parameters:
    - name: gatewayId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The AI gateway UUID.
    get:
      operationId: listGatewayTokens
      summary: List every token under a gateway
      description: 'Every phantom token under a gateway, **including gateway-level tokens

        that have no agent** — the shape `POST /v1/oauth/token` mints for MCP.

        The per-agent endpoint (`/ai-gateway/agents/{agentId}/tokens`) filters on

        `agent_id` and therefore cannot see them.


        Plaintext is never returned by any list endpoint.'
      tags:
      - AI Gateway
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: A paginated list of tokens. `agent_id` is null for a gateway-level token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiGatewayPhantomToken'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai-gateway/gateways/{gatewayId}/tokens/{tokenId}:
    parameters:
    - name: gatewayId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The AI gateway UUID.
    - name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The token UUID.
    delete:
      operationId: revokeGatewayToken
      summary: Revoke a token under a gateway
      description: 'Revokes any token under the gateway, **including a gateway-level token

        with no agent**. Use this rather than the per-agent revoke when the token

        came from `POST /v1/oauth/token`, which mints with no agent.


        Revoking an already-revoked or unknown token returns `404`.'
      tags:
      - AI Gateway
      responses:
        '200':
          description: The revoked token id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      revoked:
                        type: boolean
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai-gateway/gateways/{gatewayId}/mcp-servers:
    parameters:
    - name: gatewayId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The parent AI gateway UUID.
    get:
      operationId: listGatewayMcpServers
      summary: List a gateway's MCP servers
      description: Returns a paginated list of the MCP servers registered under a gateway.
      tags:
      - AI Gateway
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: A paginated list of MCP servers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiGatewayMcpServer'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createGatewayMcpServer
      summary: Register an MCP server
      description: 'Registers an upstream MCP server under a gateway. KnoxCall proxies it at

        `connect_url` and governs every tool call — allowlist, prompt firewall and

        PII redaction — before it reaches the upstream.


        `upstream_url` must be a public `https://` address. Private, loopback,

        link-local and cloud-metadata destinations are refused at write time and

        again at connect time, because the request carries the decrypted upstream

        credential.


        Every value in `auth.headers` must reference a KnoxCall secret (for

        example `Bearer {{secret_id:}}`). A literal credential is refused

        with `422 plaintext_auth` — storing it here would leave it in cleartext in

        the control plane.


        `server_type: collection` is not served yet and returns

        `422 unsupported_server_type`.


        An empty `allowed_tools` means the server advertises **no** tools.'
      tags:
      - AI Gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAiGatewayMcpServerRequest'
            example:
              name: Vendor tools
              slug: vendor-tools
              upstream_url: https://mcp.vendor.example/mcp
              allowed_tools:
              - get_weather
              - lookup_customer
      responses:
        '200':
          description: The registered MCP server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AiGatewayMcpServer'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PlanLimit'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/McpUnprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai-gateway/mcp-servers/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The MCP server UUID.
    get:
      operationId: getAiGatewayMcpServer
      summary: Get an MCP server
      description: Returns one MCP server, including `connect_url` and `resource`.
      tags:
      - AI Gateway
      responses:
        '200':
          description: The MCP server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AiGatewayMcpServer'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
