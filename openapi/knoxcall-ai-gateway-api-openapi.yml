  /ai-gateway/mcp-servers/{id}/grants:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The MCP server UUID.
    get:
      operationId: listAiGatewayMcpGrants
      summary: List the delegated-OAuth connections on an MCP server
      description: 'A connection is one person''s consent to let KnoxCall act as them against

        this server''s upstream. KnoxCall holds their refresh token

        envelope-encrypted under your tenant key and mints a short-lived access

        token per call.


        **No response here carries a token** — not redacted, not truncated,

        absent. `has_refresh_token` is the only thing said about them.


        **Creating a connection is not an API operation.** Consent has to be

        given by the person whose credential it is, so the flow starts from a

        signed-in KnoxCall session in the admin console. An API key is not a

        person: an endpoint that started a flow "for alice@acme" would let

        whoever holds the key finish it with their own upstream account, and the

        connection would hold the key holder''s credential under Alice''s name.'
      tags:
      - AI Gateway
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: A paginated list of connections.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiGatewayMcpGrant'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: revokeAllAiGatewayMcpGrants
      summary: Revoke every delegated-OAuth connection on an MCP server
      description: 'The offboarding-in-one-call shape. Each connection''s stored tokens are

        destroyed, not flagged: the table refuses a revoked row that still holds

        ciphertext. Anyone whose connection is revoked must consent again before

        their next tool call on this server succeeds.'
      tags:
      - AI Gateway
      responses:
        '200':
          description: How many connections were revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      revoked:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai-gateway/mcp-servers/{id}/grants/{grantId}:
