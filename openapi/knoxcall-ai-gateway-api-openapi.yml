  /ai-gateway/usage/export:
    get:
      operationId: exportAiGatewayUsage
      summary: Export AI gateway usage (FinOps)
      description: 'FinOps showback/chargeback export: aggregated spend grouped by a

        dimension over a period. With `format=csv` the endpoint streams a

        `text/csv` attachment; otherwise it returns the standard `{data, meta}`

        JSON envelope.'
      tags:
      - AI Gateway
      parameters:
      - name: group_by
        in: query
        schema:
          type: string
          default: model
        description: 'Grouping dimension: `user`, `team`, `agent`, `model`, `provider`, or `tag:<key>`.'
        example: model
      - name: period
        in: query
        schema:
          type: string
          enum:
          - 7d
          - 30d
          - 90d
          default: 30d
        description: The rollup window. Defaults to 30 days.
      - name: agent_id
        in: query
        schema:
          type: string
          format: uuid
        description: Scope the export to a single agent.
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - csv
          default: json
        description: Response format. `csv` streams a downloadable attachment.
      responses:
        '200':
          description: The usage export (JSON envelope, or a CSV attachment when `format=csv`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AiGatewayUsageExport'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai-gateway/usage:
    get:
      operationId: getAiGatewayUsage
      summary: Get AI gateway usage
      description: Returns cost and token totals broken down by model over the requested period, optionally scoped to a single agent.
      tags:
      - AI Gateway
      parameters:
      - name: period
        in: query
        schema:
          type: string
          enum:
          - 7d
          - 30d
          - 90d
          default: 30d
        description: The rollup window. Defaults to 30 days.
      - name: agent_id
        in: query
        schema:
          type: string
          format: uuid
        description: Scope the rollup to a single agent.
