description: KnoxCall webhooks deliver real‑time event notifications for request lifecycle and audit‑log events.
events:
- event: request.received
  description: Triggered when a request is received.
- event: request.success
  description: Triggered on a successful 2xx response.
- event: request.redirect
  description: Triggered on a 3xx redirect response.
- event: request.client_error
  description: Triggered on a 4xx client error.
- event: request.server_error
  description: Triggered on a 5xx server error.
- event: request.timeout
  description: Triggered when the request times out.
- event: request.error
  description: Triggered on any error (non‑2xx response).
- event: request.completed
  description: Triggered on every completed request.
- event: audit.event
  description: Triggered on any audit‑log entry (config changes, auth events).
delivery:
  signature: HMAC signature using the secret_key returned at webhook creation (default signing).
  retries: retry_on_failure defaults to true; max_retries defaults to 3.
note: Authentication type can be set via the auth_type field (none, basic, bearer, hmac, header).
